<section class="h-100" style="background-color: #8fc4b7;">

<div class="d-flex justify-content-center align-items-center" style="height: 100vh;border-radius: 50px;">
    <div class="card " style="width: 400px;">
        <div class="card-header text-center h5 text-white bg-primary">Password Reset</div>
        <div *ngIf="!authenticated" class="card-body px-5">
            <form [formGroup]="form" (ngSubmit)="checkDetails()">
            <p class="card-text py-2 text-center">
                Enter your details to authenticate.
            </p>
            <div class="form-outline">
                <label class="form-label " for="uname" >Username</label>
                <input type="text" id="uName" class="form-control mb-3" formControlName="userName" />
                <label class="form-label" for="phone" >Mobile Number</label>
                <input type="text" id="phone"  class="form-control mb-3" formControlName="mnumber" />
                <label class="form-label" for="email">Email </label>
                <input type="email" id="email" class="form-control mb-3" formControlName="email" />
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid" >Authenicate</button>
            <div class="d-flex justify-content-center mt-3">
                <a class="" routerLink="">Back to Login</a>
            </div>
        </form>
        </div>
        
        <div *ngIf="authenticated" class="card-body px-5">
            <form [formGroup]="formReset" (ngSubmit)="setPassword()">
            <p class="card-text py-2 text-center">
                Enter your new Password.
            </p>
            <div class="form-outline">
                <label class="form-label " for="password">Password</label>
                <input type="text" id="password" formControlName="password" class="form-control mb-3" />
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="formReset.invalid">Set Password</button>
            <div class="d-flex justify-content-center mt-3">
                <a class="" routerLink="">Back to Login</a>
            </div>
        </form>

        </div>
    </div>
</div>

</section>
