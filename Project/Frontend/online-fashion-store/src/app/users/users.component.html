    <section class="h-100 h-custom" style="background-color: #8fc4b7;">
        <div class="container py-5 h-100">
          <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-lg-8 col-xl-6">
              <div class="card rounded-3">
                <img src="https://img.freepik.com/free-photo/black-friday-elements-assortment_23-2149074075.jpg"
                  class="w-100" style="border-top-left-radius: .3rem; border-top-right-radius: .3rem;"
                  alt="Sample photo">
                <div class="card-body p-4 p-md-5">
                  <h3 class="mb-4 pb-2 pb-md-0 mb-md-5 px-md-2">Registration Info</h3>
      
                  <form class="px-md-2" [formGroup]="form" (ngSubmit)="newUser()">
      
                    <div class="form-outline mb-4">
                        <label class="form-label" for="name">Full Name</label>
                        <input type="text" id="name" class="form-control" formControlName="name" placeholder="Your Full Name"   />
                    </div>
                    
                    
                    <div class="form-outline mb-4">
                        <label class="form-label" for="userName">User Name</label>
                        <input type="text" id="userName" formControlName="userName" class="form-control" placeholder="Choose something easy to remember"   />
                    </div>

                    <!-- <div class="form-outline mb-4">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" class="form-control" required [(ngModel)]="user.userId" [ngModelOptions]="{standalone: true}" /> -->
                    <!-- </div> -->
                    
                    <div class="form-outline mb-4">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" formControlName="password" class="form-control" placeholder="8 Characters(one lowercase, one uppercase, one number)"  />
                    </div>
      
                    <div class="row">
                      <div class="col-md-6 mb-4">

                        <label class="form-label" for="gender">Gender</label>
                        <select id="gender" style="width: 200px; height: 35px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; padding: 5px;" class="ml-8" formControlName="gender"   >
                          <option value="Female">Female</option>
                          <option value="Male">Male</option>
                          <option value="Other">Other</option>
                        </select>
                      </div>
                    </div>

                    <div class="form-outline mb-4">
                        <label class="form-label" for="address">Address</label>
                        <input type="text" id="address" class="form-control" formControlName="address" placeholder="Where do u live?" />
                    </div>

                    <div class="form-outline mb-4">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-control" formControlName="email" placeholder="Email "     />
                    </div>

                    <div class="form-outline mb-4">
                        <label class="form-label" for="mnumber">Mobile</label>
                        <input type="text" id="mnumber" class="form-control" formControlName="mnumber" placeholder="Your Contact Number"   />
                    </div>
    
      
                    <div class="text-center">
                    <button type="submit"  class="btn btn-success btn-lg mb-1 " [disabled]="form.invalid" >Sign up</button>
                    </div>

                    <div class="text-center">
                      <a routerLink=""><button type="button"  class="btn btn-primary btn-lg mb-1 "  (click)="bToLogin()">Back to Log In</button></a>
                      </div>
                  </form>
                  
      
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
