<app-user-header></app-user-header>





  <section style="background-color: #eee;">
    <div class="text-center container py-5">
      <div class="row">
        <div class="col-lg-4 col-md-12 mb-4" *ngFor="let category of categories">
          <div class="card">
            <a [routerLink]="['/categories/',category.categoryName]">
            <div class="bg-image hover-zoom ripple ripple-surface ripple-surface-light"
              data-mdb-ripple-color="light">
              <img src={{category.categoryImageLink}}
                class="w-100" />
              
                <div class="mask">
                  <div class="d-flex justify-content-start align-items-end h-100">
                    <h5><span class="badge bg-success ms-2">{{category.badgeContent}}</span></h5>
                  </div>
                </div>
                <div class="hover-overlay">
                  <div class="mask" style="background-color: rgba(251, 251, 251, 0.15);"></div>
                </div>
              
            </div>
          </a>
            <div class="card-body">
              <a  class="">
                <h5 class="card-body mb-3">{{category.categoryName}}</h5>
              </a>
              <h6 class="card-body mb-3 text-muted">{{category.categoryDescription}}</h6>

            </div>
          </div>
        </div>
  
 </div> 
        
    </div>
    
  </section>
