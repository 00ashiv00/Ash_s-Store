<section class="vh-100" style="background-color: #eee"> 
<div class="container ">
  <h1 class="h1 text-secondary" style=" text-align:left; margin-bottom: 40px;">Your Placed Orders!</h1>
  <div class="row">
    <div class="col-sm-4" *ngFor="let order of orders">
      <div [ngClass]="{'card border-danger text-danger ' :order.status==='Cancelled', 'card bg-success text-white':order.status==='Delivered','card':order.status!='Delivered'||order.status!='Cancelled'}" style="margin-bottom: 20px;">
        <div class="card-body">
          <h5 class="card-title">Order ID: {{order.orderId}} </h5>
          <p class="card-text">
            <strong>Status: </strong>  {{order.status}}<br>
            <strong>Total Amount: </strong>Rs. {{order.totalAmount}}<br>
            <strong>Order was Placed on:</strong> {{order.orderDate}}<br><br>
            <button class="btn btn-primary" style="margin-right: 40px;" (click)="goToOrderDetails(order.orderId)">View Order Details</button>
            <button class="btn btn-danger" [disabled]="order.status==='Cancelled'||order.status==='Delivered'" (click)="cancelOrder(order.orderId)" > Cancel Order</button>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
</section>
