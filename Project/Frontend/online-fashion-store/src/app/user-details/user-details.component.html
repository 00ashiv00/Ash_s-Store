<app-user-header></app-user-header>

<div class="col-md-6 offset-md-3">
    <h3 class="mb-4 text-secondary">User Details</h3>
    <div class="form-check mb-3">
        <label class="form-check-label text-danger" for="flexCheckChecked">Update</label>
        <input class="form-check-input" type="checkbox" value="" id="flexCheckChecked" (change)="updateToggler()">
    </div>
    <form [formGroup]="form" (ngSubmit)="updateTheUser()">

        <div class="form-group">

            <div class="row">
                <div class="col">
                    <label for="name">Full name</label>
                    <input type="text" id="name" class="form-control" formControlName="name">
                </div>
                <div class="col mb-3">
                    <label for="userId">User Id</label>
                    <input type="text" id="userId" class="form-control" formControlName="userId">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label for="userName">UserName</label>
                    <input type="text" id="userName" class="form-control" formControlName="userName">
                </div>
                <div class="col mb-3">
                    <label for="address">Address</label>
                    <input type="text" id="address" class="form-control" name="address" formControlName="address">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label for="email">Email</label>
                    <input type="text" id="email" class="form-control" name="email" formControlName="email">
                </div>
                <div class="col mb-3">
                    <label for="address">Phone Number</label>
                    <input type="text" id="phone" class="form-control" name="phone" formControlName="mnumber">
                    </div>
                </div>
                
                <div class="row">
                    <div class="col">
                        <label for="password">Password</label>
                        <input type="text" id="password" class="form-control" formControlName="password">
                </div>
                
                <div class="col mb-3">
                    <label class="form-label" for="gender" style="margin-bottom:0px">Gender</label><br>
                        <select id="gender" style="margin-top:0px;width: 200px; height: 38px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; " class="ml-8" formControlName="gender"   >
                          <option value="Female">Female</option>
                          <option value="Male">Male</option>
                          <option value="Other">Other</option>
                        </select>
                </div>
            </div>


        </div>




        <div class="d-flex justify-content-center mt-2">
            <button class="btn btn-success " style="margin-right: 10px;" type="submit" 
                [disabled]="form.invalid || canUpdate">Update</button>
            
        </div>
    </form>
</div>
