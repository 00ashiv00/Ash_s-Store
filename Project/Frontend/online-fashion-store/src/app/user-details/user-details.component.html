<app-user-header></app-user-header>

<div class="col-md-6 offset-md-3">
    <h3 class="mb-4 text-secondary">User Details</h3>
    <div class="form-check mb-3">
        <label class="form-check-label text-danger" for="flexCheckChecked">Update</label>
        <input class="form-check-input" type="checkbox" value="" id="flexCheckChecked" (change)="updateToggler()">
    </div>

    <form>

        <div class="form-group">

            <div class="row">
                <div class="col">
                    <label for="name">Full name</label>
                    <input type="text" id="name" class="form-control" name="fullName" [(ngModel)]="users.fullName"
                        [disabled]="canUpdate">
                </div>
                <div class="col mb-3">
                    <label for="userId">User Id</label>
                    <input type="text" id="userId" class="form-control" name="userId" [(ngModel)]="users.userId"
                        [disabled]="canUpdate">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label for="userName">UserName</label>
                    <input type="text" id="userName" class="form-control" name="userName" [(ngModel)]="users.userName"
                        [disabled]="canUpdate">
                </div>
                <div class="col mb-3">
                    <label for="address">Address</label>
                    <input type="text" id="address" class="form-control" name="address" [(ngModel)]="users.address"
                        [disabled]="canUpdate">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label for="email">Email</label>
                    <input type="text" id="email" class="form-control" name="email" [(ngModel)]="users.email"
                        [disabled]="canUpdate">
                </div>
                <div class="col mb-3">
                    <label for="address">Phone Number</label>
                    <input type="text" id="phone" class="form-control" name="phone" [(ngModel)]="users.mobileNo"
                        [disabled]="canUpdate">
                    </div>
                </div>
                
                <div class="row">
                    <div class="col">
                        <label for="password">Password</label>
                        <input type="text" id="password" class="form-control" name="password" [(ngModel)]="users.password"
                        [disabled]="canUpdate">
                       
                        
                </div>
                <div class="col mb-3">
                    <label for="gender">Gender</label>
                    <input type="text" id="gender" class="form-control" name="gender" [(ngModel)]="users.gender"
                        [disabled]="canUpdate">
                </div>
            </div>


        </div>




        <div class="d-flex justify-content-center mt-2">
            <button class="btn btn-success " style="margin-right: 10px;" type="submit" (click)="updateTheUser()"
                [disabled]="canUpdate">Update</button>
            <a routerLink="/admin/orders"><button class="btn btn-primary " type="submit">Go back</button></a>
        </div>
    </form>
</div>
