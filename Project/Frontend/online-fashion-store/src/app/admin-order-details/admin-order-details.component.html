<section class="vh-100" style="background-color: #eee;">
    <div class="container" >
        <div class="card" >
            <h3 class="text-secondary " style="margin-left: 10px;margin-top: 20px;">Order Details</h3>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <th>Id</th>
                        <th>Quantity</th>
                        <th>Order Id</th>
                        <th>Product Id</th>
                        <th>Product Name</th>
    
                    </thead>
                    <tbody>
                        <tr *ngFor="let orderDetail of orderDetails;let i=index">
                                <td>{{i+1}}</td>
                                <td>{{orderDetail.quantity}}</td>
                                <td>{{orderDetail.orders.orderId}}</td>
                                <td>{{orderDetail.products.productId}}</td>
                                <td>{{orderDetail.products.productName}}</td>
                                
                        </tr>
                    </tbody>
                </table>
                <div class="d-flex justify-content-center mt-2" >
                <a routerLink="/admin/orders"><button class="btn btn-primary">Back to Orders</button></a>
                </div>
            </div>
    
        </div>
    </div>
    </section>
