<div class="container">
    <div class="card">
        <h3 class="text-center">Orders</h3>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                    <th>OrderId</th>
                    <th>Status</th>
                    <th>TotalAmount</th>
                    <th>orderDate</th>

                </thead>
                <tbody>
                    <tr *ngFor="let order of orders" >
                            <td>{{order.orderId}}</td>
                            <td>{{order.status}}</td>
                            <td>{{order.totalAmount}}</td>
                            <td>{{order.orderDate}}</td>
                            <!-- <td><button class="btn btn-primary" > Click to view order details</button></td> -->
                            
                            <td><a ><button class="btn btn-success" (click)="updateOrder(order.orderId)"> Update Order Status</button></a></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
