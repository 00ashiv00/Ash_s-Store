
<div class="col-md-6 offset-md-3">
    <h3>Update Order Status</h3>
    <form >

        <div class="form-group">
            <label> Order id</label>
            <input type="text" class="form-control" [(ngModel)]="order.orderId" [ngModelOptions]="{standalone: true} " disabled
                 >
        </div>

        <div class="form-group">
            <label> Order Date</label>
            <input type="text" class="form-control" [(ngModel)]="order.orderDate" [ngModelOptions]="{standalone: true}" disabled
                >
        </div>

        <div class="form-group">
            <label> Total amount</label>
            <input type="text" class="form-control" [(ngModel)]="order.totalAmount" [ngModelOptions]="{standalone: true}" disabled
                >
        </div>

        <div class="form-group mt-3">
            <label for="status" class="mb-1">Order Status</label>
            <select class="form-select" id="status" style="width: 200px; height: 35px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; padding: 5px;" [(ngModel)]="order.status" [ngModelOptions]="{standalone: true}">
                <option value="Placed">Placed</option>
                <option value="Shipped">Shipped</option>
                <option value="Delivered">Delivered</option>
                <option value="Cancelled">Cancelled</option>
            </select>
    </div>
        


        <div class="d-flex justify-content-center mt-2">
            <button class="btn btn-success " style="margin-right: 10px;" type="submit" (click)="updateTheOrder()"> Update</button>
            <a routerLink="/admin/orders"><button class="btn btn-primary " type="submit">Go back</button></a>
        </div>
    </form>
</div>
