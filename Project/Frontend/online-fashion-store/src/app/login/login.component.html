 <section class="vh-100">
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm-6 text-black">
  
          <div class="px-5 ms-xl-4">
            <i class="fas fa-crow fa-2x me-3 pt-5 mt-xl-4" style="color: #709085;"></i>
            <span class="h1 mb-0" style="font-family: Castellar;font-size: xx-large;">Ash's Store</span>
          </div>
  
          <div class="d-flex align-items-center h-custom-2 px-5 ms-xl-4 mt-5 pt-5 pt-xl-0 mt-xl-n5">
  
            <form style="width: 23rem;">
  
              <h3 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;" >Log in</h3>
  
              <div  class="form-outline mb-4">
                <input type="email" id="uname" class="form-control form-control-lg" [(ngModel)]="userName" [ngModelOptions]="{standalone: true}" />
                <label class="form-label" for="uname" >User Name</label>
              </div>
  
              <div  class="form-outline mb-4">
                <input type="password" id="pass" class="form-control form-control-lg" [(ngModel)]="password" [ngModelOptions]="{standalone: true}" />
                <label class="form-label" for="pass" >Password</label>
              </div>
              
              <div class="text-center">
                <button class="btn btn-info btn-lg btn-block" type="button" (click)="saveData()">Login</button>
              </div>
              
              

              <div class="container text-center">
                <br>
                
                <p>Not a member? <a routerLink="/sign-up">Register</a></p>
              </div>
  
  
            </form>
  
          </div>
  
        </div>
        <div class="col-sm-6 px-0 d-none d-sm-block">
          <img src="https://media.wired.com/photos/5c9040ee4950d24718d6da99/16:9/w_2400,h_1350,c_limit/shoppingcart-1066110386.jpg"
            alt="Login image" class="w-100 vh-100" style="object-fit: cover; object-position: left;">
        </div>
      </div>
    </div>
  </section>
